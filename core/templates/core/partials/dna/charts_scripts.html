<script>
    function updateVibeSeparators() {
        const vibeContainer = document.getElementById("vibe-container");
        if (!vibeContainer) return;

        const items = vibeContainer.querySelectorAll(".vibe-item");
        const separators = vibeContainer.querySelectorAll(".vibe-separator");

        if (items.length < 2) return;

        // 1. First, show all separators
        separators.forEach((sep) => (sep.style.display = "inline"));

        // 2. Loop through items to find line breaks
        for (let i = 0; i < items.length - 1; i++) {
            const currentItem = items[i];
            const nextItem = items[i + 1];

            // If the next item is on a new line, hide the separator after the current one
            if (nextItem.offsetTop > currentItem.offsetTop) {
                const separatorToHide = separators[i];
                if (separatorToHide) {
                    separatorToHide.style.display = "none";
                }
            }
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        updateVibeSeparators();

        const dnaDataScript = document.getElementById("dna-data");
        if (!dnaDataScript) return;

        const dnaData = JSON.parse(dnaDataScript.textContent);

        Chart.defaults.font.family = "VT323";
        Chart.defaults.font.size = 16;
        Chart.defaults.color = "#1f2937";

        const chartColors = [
            "#ffb4dd",
            "#40e7aa",
            "#ffa75e",
            "#8bbfff",
            "#FFE9CE",
            "#ff647c",
            "#ffe56c",
            "#A1CDF1",
            "#9af6d4",
            "#fe9393",
        ];

        // Live-enrichment state: chart instances are captured on creation so the
        // enrichment poller can call chart.update() (no teardown), and the data
        // sources are mutable so a chart created lazily AFTER an update still
        // renders the freshest values.
        let topGenresChart = null;
        let fictionChart = null;
        let liveGenres = dnaData.top_genres;
        let liveFiction = dnaData.fiction_nonfiction_split;
        // Last-rendered payloads, so a poll returning identical data doesn't
        // rebuild innerHTML (which re-probes cover images and flickers).
        let lastTopGenresJSON = null;
        let lastExtremesJSON = null;
        let lastReaderTypeRendered = null;
        let lastComparativeJSON = null;

        // --- Helper to parse data (Array of tuples vs Object) ---
        function parseChartData(data) {
            if (Array.isArray(data)) {
                return {
                    labels: data.map((item) => item[0]),
                    values: data.map((item) => item[1]),
                };
            } else if (typeof data === "object" && data !== null) {
                return {
                    labels: Object.keys(data),
                    values: Object.values(data),
                };
            }
            return { labels: [], values: [] };
        }

        // --- Helper: create chart on scroll into view ---
        function createChartOnScroll(canvasId, createFn) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const wrapper = canvas.closest(".chart-await");
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    observer.unobserve(canvas);
                    if (wrapper) {
                        wrapper.classList.remove("chart-await");
                        wrapper.classList.add("chart-visible");
                    }
                    createFn(canvas.getContext("2d"));
                }
            }, { threshold: 0.3 });
            observer.observe(canvas);
        }

        // --- Top Genres Chart ---
        if (liveGenres) {
            createChartOnScroll("topGenresChart", (ctx) => {
                const { labels: genreLabels, values: genreValues } = parseChartData(liveGenres);
                topGenresChart = new Chart(ctx, {
                    type: "doughnut",
                    data: {
                        labels: genreLabels,
                        datasets: [
                            {
                                label: "Genres",
                                data: genreValues,
                                backgroundColor: chartColors,
                                borderColor: "#1f2937",
                                borderWidth: 4,
                            },
                        ],
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: {
                            animateRotate: true,
                            animateScale: true,
                            duration: 1400,
                            easing: "easeOutQuart",
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: function (context) {
                                        let label = context.label || "";
                                        if (label) label += ": ";
                                        if (context.parsed !== null) label += context.parsed;
                                        return label;
                                    },
                                },
                            },
                        },
                    },
                });
            });
        }

        // --- Top Authors Chart ---
        if (dnaData.top_authors) {
            const { labels: authorLabels, values: authorValues } = parseChartData(dnaData.top_authors);
            createChartOnScroll("topAuthorsChart", (ctx) => {
                new Chart(ctx, {
                    type: "doughnut",
                    data: {
                        labels: authorLabels,
                        datasets: [
                            {
                                label: "Authors",
                                data: authorValues,
                                backgroundColor: chartColors,
                                borderColor: "#1f2937",
                                borderWidth: 4,
                            },
                        ],
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: {
                            animateRotate: true,
                            animateScale: true,
                            duration: 1400,
                            easing: "easeOutQuart",
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: function (context) {
                                        let label = context.label || "";
                                        if (label) label += ": ";
                                        if (context.parsed !== null) label += context.parsed;
                                        return label;
                                    },
                                },
                            },
                        },
                    },
                });
            });
        }

        // --- Helper: create diagonal stripe pattern ---
        function createStripePattern(ctx, fillColor, strokeColor) {
            const size = 24;
            const c = document.createElement("canvas");
            c.width = size;
            c.height = size;
            const s = c.getContext("2d");
            s.fillStyle = fillColor;
            s.fillRect(0, 0, size, size);
            s.strokeStyle = strokeColor;
            s.lineWidth = 10;
            s.beginPath();
            s.moveTo(0, size);
            s.lineTo(size, 0);
            s.moveTo(-size / 2, size / 2);
            s.lineTo(size / 2, -size / 2);
            s.moveTo(size / 2, size * 1.5);
            s.lineTo(size * 1.5, size / 2);
            s.stroke();
            return ctx.createPattern(c, "repeat");
        }

        // --- Fiction vs Nonfiction Chart ---
        if (liveFiction) {
            createChartOnScroll("fictionNonfictionChart", (ctx) => {
                const fictionPattern = createStripePattern(ctx, "#ffb4dd", "#ffcce8");
                const nonfictionPattern = createStripePattern(ctx, "#8bbfff", "#b0d4ff");

                const split = liveFiction;
                fictionChart = new Chart(ctx, {
                    type: "pie",
                    data: {
                        labels: ["Fiction", "Nonfiction"],
                        datasets: [
                            {
                                data: [split.fiction_count, split.nonfiction_count],
                                backgroundColor: [fictionPattern, nonfictionPattern],
                                borderColor: "#1f2937",
                                borderWidth: 5,
                            },
                        ],
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: {
                            animateRotate: true,
                            animateScale: true,
                            duration: 1400,
                            easing: "easeOutQuart",
                        },
                        animations: { colors: false },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: function (context) {
                                        // Read from the live dataset (not the closure) so
                                        // tooltips stay correct after chart.update().
                                        const data = context.dataset.data;
                                        const total = data.reduce((a, b) => a + b, 0);
                                        const pct = total ? Math.round((context.parsed / total) * 100) : 0;
                                        return context.label + ": " + pct + "%";
                                    },
                                },
                            },
                        },
                    },
                });
            });
        }

        // ============================================================
        // Live enrichment updates
        //
        // The dashboard poller dispatches `enrichment:update` with the same
        // `updated_stats` payload the completion reload would render. We mutate
        // the already-rendered cards + charts in place (chart.update(), no
        // teardown) so tiles move during enrichment instead of freezing.
        //
        // Guarded throughout on element/instance existence: cards still showing
        // a skeleton (no canvas/chart yet) are simply skipped — they fill in on
        // the completion reload.
        // ============================================================
        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = value == null ? "" : String(value);
            return div.innerHTML;
        }

        function updateTopGenres(genres, uniqueCount) {
            if (!Array.isArray(genres) || !genres.length) return;
            liveGenres = genres;

            // Skip the DOM/chart rebuild when the payload is identical to last poll.
            const genresKey = JSON.stringify([genres, uniqueCount]);
            if (genresKey === lastTopGenresJSON) return;
            lastTopGenresJSON = genresKey;

            const listEl = document.getElementById("top-genres-list");
            if (listEl) {
                listEl.innerHTML = genres
                    .map(([genre, count], i) => {
                        const color = chartColors[i % chartColors.length];
                        return (
                            `<li class="capitalize">` +
                            `<span class="border-brand-text border-2 px-2 py-1 font-bold mr-2" ` +
                            `style="background-color: ${color}">${escapeHtml(genre)}</span> ` +
                            `(${count} books)</li>`
                        );
                    })
                    .join("");
            }

            const countEl = document.getElementById("unique-genres-count");
            if (countEl && typeof uniqueCount === "number") countEl.textContent = uniqueCount;

            if (topGenresChart) {
                const { labels, values } = parseChartData(genres);
                topGenresChart.data.labels = labels;
                topGenresChart.data.datasets[0].data = values;
                topGenresChart.update();
            }
        }

        function updateFictionNonfiction(split) {
            if (!split) return;
            const total = split.fiction_count + split.nonfiction_count;
            if (total <= 0) return;
            liveFiction = split;

            const fEl = document.getElementById("fiction-pct");
            const nfEl = document.getElementById("nonfiction-pct");
            if (fEl) fEl.textContent = Math.round((split.fiction_count / total) * 100) + "%";
            if (nfEl) nfEl.textContent = Math.round((split.nonfiction_count / total) * 100) + "%";

            const note = document.getElementById("fiction-coverage-note");
            if (note) {
                if (split.defaulted_count) {
                    note.textContent =
                        `Based on ${total} of ${total + split.defaulted_count} books — ` +
                        "refresh in a few minutes for more complete data";
                    note.style.display = "";
                } else {
                    note.style.display = "none";
                }
            }

            if (fictionChart) {
                fictionChart.data.datasets[0].data = [split.fiction_count, split.nonfiction_count];
                fictionChart.update();
            }
        }

        // Build a single book cover node, replicating the template's img-load
        // fallback (crosshatch placeholder → real cover, or accent initial on
        // failure) in vanilla JS so we don't depend on Alpine re-init.
        function buildBookCover(book, accentBg) {
            const box = document.createElement("div");
            const initial = book.initial || (book.title ? book.title[0].toUpperCase() : "?");
            const showInitial = () => {
                box.className =
                    `${accentBg} border-brand-text shadow-neo-sm flex h-40 w-[6.75rem] ` +
                    "items-center justify-center border-2 text-5xl font-bold";
                box.textContent = initial;
            };
            if (book.cover_url) {
                box.className = "cover-crosshatch border-brand-text shadow-neo-sm h-40 w-[6.75rem] border-2";
                const probe = new Image();
                probe.onload = () => {
                    if (probe.naturalWidth < 10) {
                        showInitial();
                        return;
                    }
                    box.className = "border-brand-text shadow-neo-sm h-40 w-[6.75rem] overflow-hidden border-2";
                    box.innerHTML = "";
                    const shown = document.createElement("img");
                    shown.src = book.cover_url;
                    shown.alt = "Cover of " + book.title;
                    shown.className = "h-full w-full object-cover";
                    box.appendChild(shown);
                };
                probe.onerror = showInitial;
                probe.src = book.cover_url;
            } else {
                showInitial();
            }
            return box;
        }

        function buildBookRow(book, label, accentBg) {
            const row = document.createElement("div");
            row.className = "flex items-start gap-4";

            const coverWrap = document.createElement("div");
            coverWrap.className = "shrink-0";
            coverWrap.appendChild(buildBookCover(book, accentBg));

            const info = document.createElement("div");
            info.className = "min-w-0 flex-1";
            info.innerHTML =
                `<span class="${accentBg} border-brand-text mb-2 inline-block border-2 px-2 py-0.5 ` +
                `text-sm font-bold uppercase">${label}</span>` +
                `<p class="line-clamp-2 text-xl font-bold">${escapeHtml(book.title)}</p>` +
                `<p class="truncate text-lg text-gray-600">by ${escapeHtml(book.author)}</p>` +
                `<p class="text-lg font-bold">${book.page_count} pages</p>`;

            row.appendChild(coverWrap);
            row.appendChild(info);
            return row;
        }

        function updateBookExtremes(stats) {
            const card = document.getElementById("book-extremes-card");
            if (!card) return;
            const longest = stats.longest_book;
            const shortest = stats.shortest_book;
            // Only swap once we have a genuine pair — never flash an empty state.
            if (!longest || !shortest) return;

            // Skip the rebuild when unchanged, so cover <img> probes don't re-run
            // and flicker on every poll.
            const extremesKey = JSON.stringify([longest, shortest, stats.page_difference]);
            if (extremesKey === lastExtremesJSON) return;
            lastExtremesJSON = extremesKey;

            card.innerHTML =
                `<h2 class="mb-1 text-center text-2xl font-bold uppercase">Book Extremes</h2>` +
                `<p class="mb-4 text-center text-base text-gray-500 italic">A ${stats.page_difference}-page ` +
                `difference between your longest and shortest reads</p>` +
                `<div class="flex flex-col gap-6" id="book-extremes-rows"></div>`;

            const rows = card.querySelector("#book-extremes-rows");
            rows.appendChild(buildBookRow(longest, "Longest", "bg-brand-orange"));
            rows.appendChild(buildBookRow(shortest, "Shortest", "bg-brand-green"));
        }

        function updateReaderType(stats) {
            // No-op for older users whose poll response omits reader_type.
            if (!stats || stats.reader_type === undefined) return;

            const nameEl = document.getElementById("reader-type-name");
            const explEl = document.getElementById("reader-type-explanation");
            const bannerEl = document.getElementById("reader-type-banner");

            // Only rewrite the type + blurb when the winning type actually changed,
            // so the explanation doesn't churn on every poll.
            if (stats.reader_type !== lastReaderTypeRendered) {
                if (nameEl) nameEl.textContent = stats.reader_type;
                if (explEl) explEl.textContent = stats.reader_type_explanation || "";
                lastReaderTypeRendered = stats.reader_type;
            }

            // Swap the reader-banner--{color} class on the banner element.
            if (bannerEl && stats.reader_type_color) {
                const colorPrefix = "reader-banner--";
                bannerEl.classList.forEach((cls) => {
                    if (cls.startsWith(colorPrefix)) bannerEl.classList.remove(cls);
                });
                bannerEl.classList.add(`${colorPrefix}${stats.reader_type_color}`);
            }

            // Rebuild the top traits leaderboard from the updated list.
            const listEl = document.getElementById("top-traits-list");
            if (listEl && Array.isArray(stats.top_reader_types)) {
                const medalClasses = [
                    { bg: "bg-yellow-300", border: "border-yellow-500" },
                    { bg: "bg-gray-300",   border: "border-gray-500"   },
                    { bg: "bg-amber-500",  border: "border-amber-700"  },
                ];
                const isPct = !!stats.reader_type_scores_version;
                listEl.innerHTML = stats.top_reader_types.slice(0, 3).map((item, idx) => {
                    const { bg, border } = medalClasses[idx] || medalClasses[2];
                    const scoreText = isPct ? `${item.score}%` : item.score;
                    return `<li class="flex items-center justify-between p-2 border-2 border-brand-text ${bg} shadow-neo-sm">` +
                        `<div class="flex items-center">` +
                        `<span class="font-bold text-xl mr-4">#${idx + 1}</span>` +
                        `<span class="font-bold">${item.type}</span>` +
                        `</div>` +
                        `<div class="font-bold px-3 py-1 border-2 ${border} bg-white">${scoreText}</div>` +
                        `</li>`;
                }).join("");
            }
        }

        // Capitalize first letter (matches Django's |capfirst on the server text).
        function capfirst(value) {
            const s = value == null ? "" : String(value);
            return s.charAt(0).toUpperCase() + s.slice(1);
        }

        function updateComparative(stats) {
            const ct = stats.comparative_text;
            if (!ct) return;

            // Anti-flicker: skip the whole comparative refresh when nothing that
            // feeds it changed since the last poll (mirrors PR #138's guards).
            const key = JSON.stringify([
                ct,
                stats.avg_book_length,
                stats.avg_publish_year,
                stats.avg_books_per_year,
                stats.number_line_ranges,
                stats.community_averages,
                stats.global_averages,
            ]);
            if (key === lastComparativeJSON) return;
            lastComparativeJSON = key;

            // --- Poster numbers + comparative sentences ---
            const lenVal = document.getElementById("comp-length-value");
            if (lenVal && stats.avg_book_length != null) lenVal.textContent = stats.avg_book_length;
            const lenText = document.getElementById("comp-length-text");
            if (lenText && ct.length_direction != null) {
                lenText.innerHTML =
                    `${capfirst(ct.length_direction)} than <strong>${escapeHtml(ct.length_pct)}%</strong> ` +
                    "of Bibliotype readers";
            }

            const ageVal = document.getElementById("comp-age-value");
            if (ageVal && stats.avg_publish_year != null) ageVal.textContent = Math.round(stats.avg_publish_year);
            const ageText = document.getElementById("comp-age-text");
            if (ageText && ct.age_direction != null) {
                ageText.innerHTML =
                    `${capfirst(ct.age_direction)} than <strong>${escapeHtml(ct.age_pct)}%</strong> ` +
                    "of Bibliotype readers";
            }

            // --- Number-line markers ---
            // The number lines are Alpine components: positions derive reactively
            // from userVal/compVal/thirdVal/min/max, so we just push fresh values
            // into each component's scope and Alpine repositions the markers +
            // legend. Guarded on Alpine.$data being available; if not, the poster
            // text above still updated and the lines settle on the next reload.
            if (!(window.Alpine && typeof Alpine.$data === "function")) return;
            const ranges = stats.number_line_ranges || {};
            const comm = stats.community_averages || {};
            const glob = stats.global_averages || {};
            const metricValues = {
                pages: { user: stats.avg_book_length, comp: comm.avg_book_length, third: glob.avg_book_length_pages },
                year: { user: stats.avg_publish_year, comp: comm.avg_publish_year, third: glob.avg_publish_year },
                bpy: { user: stats.avg_books_per_year, comp: comm.avg_books_per_year, third: glob.avg_books_per_year },
            };
            document.querySelectorAll("[data-nl-metric]").forEach((el) => {
                const metric = el.dataset.nlMetric;
                const vals = metricValues[metric];
                const range = ranges[metric];
                if (!vals) return;
                let scope;
                try {
                    scope = Alpine.$data(el);
                } catch (e) {
                    return;
                }
                if (!scope) return;
                if (range && range.min != null) scope.min = range.min;
                if (range && range.max != null) scope.max = range.max;
                if (vals.user != null) scope.userVal = vals.user;
                if (vals.comp != null) scope.compVal = vals.comp;
                if (vals.third != null) scope.thirdVal = vals.third;
            });
        }

        function applyEnrichmentUpdate(stats) {
            if (!stats) return;
            updateTopGenres(stats.top_genres, stats.unique_genres_count);
            updateFictionNonfiction(stats.fiction_nonfiction_split);
            updateBookExtremes(stats);
            updateReaderType(stats);
            updateComparative(stats);
        }

        window.addEventListener("enrichment:update", (event) => applyEnrichmentUpdate(event.detail));
    });

    window.addEventListener("resize", updateVibeSeparators);

    // --- Scroll-triggered fade-in animations ---
    document.addEventListener("DOMContentLoaded", function () {
        const scrollEls = document.querySelectorAll(".scroll-fade-left, .scroll-fade-up");
        if (!scrollEls.length) return;
        const obs = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    entry.target.classList.add("is-visible");
                    obs.unobserve(entry.target);
                }
            });
        }, { threshold: 0.2 });
        scrollEls.forEach((el) => obs.observe(el));
    });
</script>
