{% comment %}
    condition (required) — server-render gate (e.g. enrichment.pending or enrichment.pages_any_missing) store_key
    (optional, default "pending") — Alpine store key driving live x-show
{% endcomment %}
{% if condition %}
    <p
        class="enrichment-banner bg-brand-yellow/30 absolute inset-x-0 top-0 z-10 animate-[enrichPulse_2s_ease-in-out_infinite] py-0.5 text-center text-sm"
        x-data
        x-show="$store.enrichment?.{{ store_key|default:'pending' }}"
        x-cloak
    >
        Still enriching
    </p>
{% endif %}
