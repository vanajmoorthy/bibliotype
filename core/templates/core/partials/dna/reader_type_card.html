{% load dna_extras %}
{% if dna.reader_type %}
    <div
        id="reader-type-banner"
        class="pixel-banner reader-banner--{{ dna.reader_type|reader_color }} border-brand-text shadow-neo border-2 p-4 text-center sm:p-6"
    >
        {% if enrichment.pending %}
            <template x-if="$store.enrichment?.pending">
                <div
                    x-data="enrichmentPoller()"
                    x-cloak
                    class="-mx-4 -mt-4 mb-3 animate-[enrichPulse_2s_ease-in-out_infinite] bg-white/60 py-1.5 text-center text-sm sm:-mx-6 sm:-mt-6 sm:mb-4"
                >
                    <span x-text="bannerText">
                        Enriching your library — {{ enrichment.percent }}% complete. ~{{ enrichment.remaining_minutes }}
                        min remaining.
                    </span>
                    <button
                        @click="showInfo = !showInfo"
                        class="border-brand-text/40 hover:bg-brand-yellow/50 ml-1 inline-flex h-5 w-5 items-center justify-center rounded-full border text-sm leading-none"
                        title="Why?"
                    >
                        i
                    </button>
                    <div
                        x-show="showInfo"
                        x-cloak
                        @click.away="showInfo = false"
                        class="border-brand-text/20 mx-auto mt-2 max-w-lg rounded border bg-white/90 p-2 text-left text-sm leading-relaxed"
                    >
                        {% if enrichment.csv_source == "storygraph" %}
                            StoryGraph exports don't include genre or page count data, so we fetch this from Open
                            Library and Google Books in the background.
                        {% else %}
                            We're fetching genre data for your books from Open Library and Google Books in the
                            background.
                        {% endif %}
                    </div>
                </div>
            </template>
        {% endif %}
        <div class="text-lg uppercase">{{ owner_pos|default:"Your" }} Reader Type is...</div>
        <div id="reader-type-name" class="mt-1 text-5xl font-bold tracking-widest uppercase">{{ dna.reader_type }}</div>
        {% if dna.reader_type_explanation %}
            <p id="reader-type-explanation" class="mx-auto mt-4 max-w-2xl text-lg">{{ dna.reader_type_explanation }}</p>
        {% endif %}
    </div>
{% endif %}
