<button
    type="{{ type|default:'submit' }}"
    class="bg-brand-green text-brand-text border-brand-text shadow-neo-sm border-2 px-4 py-2 font-bold transition-all duration-150 ease-in-out active:translate-x-0.5 active:translate-y-0.5 cursor-pointer {{ extra_classes|default:'' }} hover:translate-x-px hover:translate-y-px neo-3d-sm hover:shadow-neo-xs active:shadow-none"
    {{ extra_attrs|safe }}
    >
    {{ text }}
</button>
