{% if color == 'green' %}
    <a
        href="{{ href }}"
        class="shadow-neo border-brand-text bg-brand-green {{ extra_classes|default:'' }} inline-block cursor-pointer border-2 px-6 py-3 font-bold transition-all duration-150 ease-in-out active:translate-x-1 active:translate-y-1 neo-3d hover:translate-x-px hover:translate-y-px hover:shadow-neo-md active:shadow-none"
    >
        {{ text }}
    </a>
{% elif color == 'cyan' %}
    <a
        href="{{ href }}"
        class="shadow-neo border-brand-text bg-brand-cyan {{ extra_classes|default:'' }} inline-block cursor-pointer border-2 px-6 py-3 font-bold transition-all duration-150 ease-in-out active:translate-x-1 active:translate-y-1 neo-3d hover:translate-x-px hover:translate-y-px hover:shadow-neo-md active:shadow-none"
    >
        {{ text }}
    </a>
{% else %}
    <a
        href="{{ href }}"
        class="shadow-neo border-brand-text bg-brand-green {{ extra_classes|default:'' }} inline-block cursor-pointer border-2 px-6 py-3 font-bold transition-all duration-150 ease-in-out active:translate-x-1 active:translate-y-1 neo-3d hover:translate-x-px hover:translate-y-px hover:shadow-neo-md active:shadow-none"
    >
        {{ text }}
    </a>
{% endif %}
