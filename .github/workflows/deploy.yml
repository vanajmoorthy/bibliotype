name: Deploy to DigitalOcean
# Deploy only after the test workflow passes on a push to main. Previously
# this ran on push in parallel with the tests, so a red build still shipped.
# `branches` matches the CI run's head branch, so a fork PR from a branch named
# main also gets here; the job's event check drops it.
on:
    workflow_run:
        workflows: ["Django CI"]
        types: [completed]
        branches: [main]

permissions:
    contents: read

jobs:
    deploy:
        if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
        # Serialize deploys: two quick merges used to run `docker compose up
        # --force-recreate` on the droplet concurrently, colliding and leaving every
        # container wedged in "Created" (prod 502'd on 2026-09-02). Queue instead —
        # and never cancel an in-flight deploy mid-recreate. Job-level so runs
        # skipped by the `if` (failed CI, fork PRs) never take the queue slot and
        # cancel a pending real deploy.
        concurrency:
            group: production-deploy
            cancel-in-progress: false
        runs-on: ubuntu-latest
        steps:
            # Check out the exact commit the tests ran on, not whatever main is now.
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Login to Docker Hub
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Get commit hash
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

            - name: Build and push Docker image
              uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
              with:
                  context: .
                  push: true
                  # Tag with 'latest'
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/bibliotype:latest
                      ${{ secrets.DOCKERHUB_USERNAME }}/bibliotype:${{ steps.vars.outputs.sha_short }}

            - name: Deploy to DigitalOcean VPS
              uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
              with:
                  host: ${{ secrets.DO_SSH_HOST }}
                  username: ${{ secrets.DO_SSH_USERNAME }}
                  key: ${{ secrets.DO_SSH_KEY }}

                  script: |
                      # Fail the job on any failed step; without this the exit status
                      # was the last command's (image prune), so broken deploys went green.
                      set -e
                      cd /home/bibliotype/app

                      DEPLOY_SHA=${{ github.event.workflow_run.head_sha }}
                      git fetch origin main

                      # Test runs can finish out of order. Never roll prod back to a
                      # commit older than the one already deployed (its image could
                      # predate migrations that have since been applied).
                      if [ "$(git rev-parse HEAD)" != "$DEPLOY_SHA" ] && git merge-base --is-ancestor "$DEPLOY_SHA" HEAD; then
                          echo "$DEPLOY_SHA is older than the deployed commit; skipping."
                          exit 0
                      fi

                      # Same commit as the image, so compose file and code match.
                      git reset --hard "$DEPLOY_SHA"

                      export IMAGE_TAG=${{ steps.vars.outputs.sha_short }}
                      export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}

                      export $(cat /home/bibliotype/app/.env | xargs)


                      docker pull $DOCKERHUB_USERNAME/bibliotype:$IMAGE_TAG

                      # No --force-recreate: only services whose config changed are
                      # recreated (web/worker: new IMAGE_TAG each commit). Recreating
                      # redis (no volume) wiped queued tasks and in-flight uploads.
                      # --wait fails the deploy if web never turns healthy.
                      docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 300

                      echo "Fixing static file permissions..."
                      sudo chown -R bibliotype:www-data /home/bibliotype/app/staticfiles/
                      sudo chmod -R 775 /home/bibliotype/app/staticfiles/

                      echo "Pruning old docker images"
                      # -a is required: every deploy tags a unique :sha image, so old
                      # images are never dangling and plain `prune -f` removes nothing.
                      # They piled up ~1.3GB per deploy until the disk hit 100% and
                      # took prod down on 2026-09-05. -a keeps images in use by running
                      # containers (current app image, postgres, redis) and drops the rest;
                      # rollbacks re-pull any :sha tag from Docker Hub.
                      docker image prune -af
