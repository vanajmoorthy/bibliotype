services:
    db:
        image: postgres:15
        # Postgres defaults assume a much larger machine; keep it to ~150-200MB
        # of the 1GB droplet. max_connections=50 covers 4 web threads + worker
        # with headroom (steady state is ~6 connections).
        command:
            - postgres
            - -c
            - shared_buffers=128MB
            - -c
            - effective_cache_size=384MB
            - -c
            - work_mem=4MB
            - -c
            - maintenance_work_mem=32MB
            - -c
            - max_connections=50
        mem_limit: 280m
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        environment:
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped
    redis:
        image: redis:7-alpine
        # volatile-lru, NOT allkeys-lru: the Celery broker (db 0) shares this
        # instance with the cache (db 1). allkeys-lru could evict queued task
        # messages under memory pressure; volatile-lru only evicts TTL'd keys
        # (cache entries, task results), never the queues. --save "" drops RDB
        # snapshotting — there's no data volume, so persistence was moot anyway.
        command: ["redis-server", "--maxmemory", "100mb", "--maxmemory-policy", "volatile-lru", "--save", ""]
        mem_limit: 130m
        # No ports are exposed to the outside world in production.
        # The 'web' and 'worker' services can still access it via the internal Docker network.
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 5s
        restart: unless-stopped

    web:
        build: .
        image: ${DOCKERHUB_USERNAME}/bibliotype:${IMAGE_TAG:-latest}
        # gthread threads over extra workers: a second sync worker would duplicate
        # the ~250MB Django+pandas process on a 1GB box; 4 threads share one
        # process for ~4x request concurrency (views are I/O-bound: DB + progress
        # polling). --timeout 60 covers slow views under CPU contention while a
        # DNA task holds the core.
        command:
            [
                "poetry",
                "run",
                "gunicorn",
                "bibliotype.wsgi:application",
                "--bind",
                "0.0.0.0:8000",
                "--workers",
                "1",
                "--threads",
                "4",
                "--worker-class",
                "gthread",
                "--timeout",
                "60",
                "--graceful-timeout",
                "30",
                "--keep-alive",
                "5",
                "--max-requests",
                "1000",
                "--max-requests-jitter",
                "100",
            ]
        # web/worker deliberately get no mem_limit: pandas DNA processing has a
        # spiky footprint and a hard cap would OOM-kill real work. db+redis are
        # capped instead, and the droplet has 2GB swap as the safety net.
        volumes:
            - ./staticfiles:/app/staticfiles
        ports:
            - "127.0.0.1:8000:8000"
        environment:
            - DJANGO_ENV=production
            - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
            - CELERY_BROKER_URL=redis://redis:6379/0
            - CELERY_RESULT_BACKEND=redis://redis:6379/0
            - REDIS_CACHE_URL=redis://redis:6379/1
            - SECRET_KEY=${SECRET_KEY}
            - POSTHOG_API_KEY=${POSTHOG_API_KEY}
            - GEMINI_API_KEY=${GEMINI_API_KEY}
            - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
            - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY}
            - DEBUG=${DEBUG}
            - ALLOWED_HOSTS=${ALLOWED_HOSTS}
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - EMAIL_HOST=${EMAIL_HOST}
            - EMAIL_PORT=${EMAIL_PORT}
            - EMAIL_HOST_USER=${EMAIL_HOST_USER}
            - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
            - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
            - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
            - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    worker:
        build: .
        image: ${DOCKERHUB_USERNAME}/bibliotype:${IMAGE_TAG:-latest}
        # -Q order is selection only, not priority — queue_order_strategy
        # "sorted" in settings.py decides drain order (celery first).
        # -B runs celery beat inside the worker (CELERY_BEAT_SCHEDULE tasks:
        # daily session anonymization, weekly publisher research). A separate
        # beat container isn't worth the RAM on the 1GB droplet. The schedule
        # file lives in /tmp — it's just beat's bookkeeping, safe to lose on
        # container recreate.
        command: sh -c "poetry run celery -A bibliotype worker -B -s /tmp/celerybeat-schedule -l info -Q celery,enrichment_bulk"
        environment:
            - DJANGO_ENV=production
            - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
            - CELERY_BROKER_URL=redis://redis:6379/0
            - CELERY_RESULT_BACKEND=redis://redis:6379/0
            - REDIS_CACHE_URL=redis://redis:6379/1
            - SECRET_KEY=${SECRET_KEY}
            - POSTHOG_API_KEY=${POSTHOG_API_KEY}
            - GEMINI_API_KEY=${GEMINI_API_KEY}
            - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
            - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY}
            - DEBUG=${DEBUG}
            - ALLOWED_HOSTS=${ALLOWED_HOSTS}
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

volumes:
    postgres_data:
